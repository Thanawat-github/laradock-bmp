; Tuning for the Octane worker, following https://frankenphp.dev/docs/performance/
; The image loads no php.ini, so without this file PHP runs on its built-in defaults.

; Laravel and its vendor tree are about 11,000 classes, more than the default 10,000 slots,
; and their many class and method names overflow the default 8 MB of interned strings.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000

; Worker mode keeps the code in memory until `octane:reload`, so checking timestamps only
; matters for files read per request. Set validate_timestamps=0 in production.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; GraphQL resolution is CPU bound, the tracing JIT measured 10-15% faster on this app.
opcache.jit=tracing
opcache.jit_buffer_size=64M

realpath_cache_size=4096K
realpath_cache_ttl=600
